<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e1e1e1;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #272727;
    }

    .header img {
      width: 28px;
      height: 28px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .header span {
      font-size: 11px;
      color: #717171;
      margin-left: auto;
    }

    .toggle-all {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1a1a2e;
      border-bottom: 1px solid #272727;
    }

    .toggle-all span {
      font-size: 13px;
      font-weight: 600;
      color: #bb86fc;
    }

    .options {
      padding: 8px 0;
      max-height: 400px;
      overflow-y: auto;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      transition: background 0.15s;
    }

    .option:hover {
      background: #1a1a1a;
    }

    .option-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .option-label .name {
      font-size: 13px;
      font-weight: 500;
      color: #e1e1e1;
    }

    .option-label .desc {
      font-size: 11px;
      color: #717171;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #3a3a3a;
      border-radius: 20px;
      transition: 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      bottom: 3px;
      background: #888;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider {
      background: #7c4dff;
    }

    input:checked + .slider::before {
      transform: translateX(16px);
      background: #fff;
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #272727;
      text-align: center;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Focus YT">
    <h1>Focus YT</h1>
    <span>v1.0</span>
  </div>

  <div class="toggle-all">
    <span>Enable All</span>
    <label class="switch">
      <input type="checkbox" id="toggleAll">
      <span class="slider"></span>
    </label>
  </div>

  <div class="options" id="options"></div>

  <div class="footer">Distraction-free YouTube</div>

  <script src="popup.js"></script>
</body>
</html>
